<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Jardim Para Você 🌱</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Georgia, serif;
    background:linear-gradient(
        to bottom,
        #cfe9ff 0%,
        #e8f5ff 45%,
        #c7e7b2 46%,
        #8ec07c 100%
    );
}

#titulo{
    text-align:center;
    margin-top:25px;
    color:#355e3b;
}

#subtitulo{
    text-align:center;
    color:#557a5a;
    margin-top:8px;
}

#jardim{
    position:relative;
    width:100%;
    height:70vh;
}

.flor{
    position:absolute;
    font-size:55px;
    cursor:pointer;
    transition:.3s;
}

.flor:hover{
    transform:scale(1.2) rotate(-5deg);
}

#mensagem{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:80%;
    max-width:650px;

    background:rgba(255,255,255,.85);
    backdrop-filter:blur(5px);

    padding:20px;
    border-radius:15px;

    text-align:center;
    color:#444;

    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

#muda{
    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    font-size:70px;
    cursor:pointer;
    transition:.4s;
}

#muda:hover{
    transform:translate(-50%,-50%) scale(1.15);
}

#regador{
    position:absolute;
    top:20px;
    right:25px;
    font-size:45px;
    cursor:pointer;
    transition:.3s;
}

#regador:hover{
    transform:rotate(-15deg);
}

.gota{
    position:absolute;
    font-size:20px;
    animation:cair 1s linear forwards;
}

@keyframes cair{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(120px);
    }
}

.estrela{
    position:absolute;
    color:white;
    opacity:.8;
    animation:piscar 3s infinite;
}

@keyframes piscar{
    50%{
        opacity:.3;
    }
}
</style>
</head>

<body>

<h1 id="titulo">🌱 Um Jardim Para Você</h1>
<p id="subtitulo">Algumas coisas crescem devagar. E tudo bem.</p>

<div id="regador">🪴</div>

<div id="jardim">

    <div class="flor" style="left:15%; top:65%;">🌷</div>
    <div class="flor" style="left:30%; top:72%;">🌼</div>
    <div class="flor" style="left:70%; top:70%;">🌹</div>
    <div class="flor" style="left:82%; top:60%;">🌸</div>

    <div id="muda">🌱</div>

</div>

<div id="mensagem">
    Clique em uma flor ou na muda do centro.
</div>

<script>

const caixa = document.getElementById("mensagem");

const mensagensFlores = [

"Você me ensinou a enxergar beleza em coisas pequenas.",

"Existe uma lembrança sua que ainda me faz sorrir.",

"Espero que hoje tenha sido gentil com você.",

"Você não precisa florescer todos os dias.",

"Mesmo os jardins mais bonitos passam por estações.",

"Há pessoas que deixam flores dentro da gente.",

"Seu valor não depende do quanto você consegue produzir.",

"Descansar também faz parte de crescer."
];

document.querySelectorAll(".flor").forEach(flor => {

    flor.addEventListener("click", () => {

        const texto =
        mensagensFlores[
            Math.floor(
                Math.random() * mensagensFlores.length
            )
        ];

        caixa.innerHTML = texto;
    });

});

const fases = [
    "🌱",
    "🌿",
    "☘️",
    "🌷",
    "🌸",
    "🌳"
];

let etapa = 0;

document.getElementById("muda")
.addEventListener("click", () => {

    if(etapa < fases.length - 1){
        etapa++;
    }

    document.getElementById("muda")
    .textContent = fases[etapa];

    const frases = [
        "O crescimento leva tempo.",
        "Um passo de cada vez.",
        "Nem toda mudança é visível imediatamente.",
        "Ainda está crescendo.",
        "Tudo bem não ter pressa.",
        "A primavera sempre encontra seu caminho."
    ];

    caixa.innerHTML =
    frases[Math.floor(Math.random()*frases.length)];

});

document.getElementById("regador")
.addEventListener("click", () => {

    caixa.innerHTML =
    mensagensFlores[
        Math.floor(
            Math.random()*mensagensFlores.length
        )
    ];

    const gota = document.createElement("div");

    gota.classList.add("gota");
    gota.innerHTML = "💧";

    gota.style.right = "35px";
    gota.style.top = "70px";

    document.body.appendChild(gota);

    setTimeout(() => gota.remove(), 1000);

});

const hora = new Date().getHours();

if(hora >= 18){

    document.body.style.background =
    "linear-gradient(to bottom,#1f2940 0%,#324d66 45%,#466e49 46%,#274427 100%)";

    document.getElementById("titulo")
    .style.color = "#ffffff";

    document.getElementById("subtitulo")
    .style.color = "#dfefff";

    for(let i=0;i<30;i++){

        const estrela =
        document.createElement("div");

        estrela.classList.add("estrela");

        estrela.innerHTML = "✦";

        estrela.style.left =
        Math.random()*100 + "%";

        estrela.style.top =
        Math.random()*40 + "%";

        estrela.style.fontSize =
        (10 + Math.random()*12) + "px";

        document.body.appendChild(estrela);
    }
}

</script>

</body>
  </html>
