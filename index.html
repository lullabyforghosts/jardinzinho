<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Jardim da Noite Eterna ✦</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Georgia, serif;
    background: linear-gradient(to bottom, #05070f 0%, #0c1020 45%, #161a15 46%, #0a140d 100%);
    position: relative;
}

#titulo{
    text-align:center;
    margin-top:25px;
    color:#f4d068;
    font-weight: 300;
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(244, 208, 104, 0.4);
}

#subtitulo{
    text-align:center;
    color:#8a9ba8;
    margin-top:8px;
    font-style: italic;
    font-size: 0.95rem;
}

#jardim{
    position:relative;
    width:100%;
    height:70vh;
}

/* Estrutura Base das Flores em CSS */
.flor {
    position: absolute;
    cursor: pointer;
    transition: .3s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.flor:hover{
    transform:scale(1.15) rotate(-5deg);
}

/* 1. O Girassol de Van Gogh (Estilizado) */
.girassol {
    width: 70px;
    height: 70px;
    background: radial-gradient(circle, #f4d068 30%, #c98a14 90%);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(244, 208, 104, 0.3);
}
.girassol::before {
    content: '';
    position: absolute;
    width: 35px;
    height: 35px;
    background: #2b1a09;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: inset 0 0 8px #000;
}
/* Pétalas pontiagudas do girassol */
.girassol-petalas {
    position: absolute;
    width: 85px;
    height: 85px;
    background: transparent;
    border-radius: 50%;
    border: 4px dashed #f4d068;
    transform: rotate(20deg);
}

/* 2. Rosa Carmesim (Drácula) */
.rosa-carmesim {
    width: 60px;
    height: 60px;
    background: #580000;
    border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%;
    box-shadow: inset 0 0 15px #000, 0 0 10px rgba(88, 0, 0, 0.5);
    border: 1px solid #1a0003;
}

/* 3. Rosa Azul Noite */
.rosa-azul {
    width: 60px;
    height: 60px;
    background: #1c2d42;
    border-radius: 50%;
    box-shadow: inset 0 0 15px #0b131c, 0 0 10px rgba(28, 45, 66, 0.6);
}

/* O Caule das Flores */
.caule {
    position: absolute;
    width: 4px;
    height: 80px;
    background: linear-gradient(to bottom, #192d20, #0a140d);
    top: 100%;
    z-index: -1;
}

/* 4. A Muda Central: Rosa Negra que Desabrocha */
#muda {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%,-50%);
    cursor: pointer;
    transition: .4s;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#muda:hover {
    transform: translate(-50%,-50%) scale(1.1);
}

/* Estágios da Rosa Negra */
.botoes-rosa {
    background: #111;
    border: 1px solid #222;
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
    transition: all 0.5s ease;
}
.estagio-0 { width: 15px; height: 30px; border-radius: 50% 50% 0 0; }
.estagio-1 { width: 25px; height: 35px; border-radius: 40% 40% 20% 20%; background: #1a1115; }
.estagio-2 { width: 40px; height: 45px; border-radius: 30% 30% 30% 30%; background: #26121b; }
.estagio-3 { width: 55px; height: 55px; border-radius: 40% 60% 40% 60%; background: #3d0c1b; }
.estagio-4 { width: 65px; height: 65px; border-radius: 50%; background: #50061c; box-shadow: inset 0 0 15px #000; }

#mensagem{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:80%;
    max-width:650px;

    background: rgba(10, 11, 16, 0.9);
    backdrop-filter:blur(8px);
    border: 1px solid rgba(244, 208, 104, 0.2);

    padding:20px;
    border-radius:6px;

    text-align:center;
    color:#d1d5db;
    line-height: 1.5;

    box-shadow:0 10px 30px rgba(0,0,0,.7);
}

#regador{
    position:absolute;
    top:20px;
    right:25px;
    font-size:35px;
    cursor:pointer;
    transition:.3s;
    filter: drop-shadow(0 0 5px rgba(244, 208, 104, 0.2));
}

#regador:hover{
    transform:rotate(-15deg);
}

.gota{
    position:absolute;
    font-size:20px;
    animation:cair 1s linear forwards;
}

@keyframes cair{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(120px);
    }
}

.estrela{
    position:absolute;
    color:#f4d068;
    opacity:.8;
    animation:piscar 3s infinite;
}

@keyframes piscar{
    50%{ opacity:.2; }
}
</style>
</head>

<body>

<h1 id="titulo">✦ O Jardim da Noite Eterna</h1>
<p id="subtitulo">A noite sempre parece mais viva e ricamente colorida.</p>

<div id="regador">🍷</div>

<div id="jardim">

    <div class="flor" style="left:15%; top:60%;">
        <div class="rosa-carmesim"></div>
        <div class="caule"></div>
    </div>
    
    <div class="flor" style="left:32%; top:58%;">
        <div class="girassol"></div>
        <div class="girassol-petalas"></div>
        <div class="caule" style="height: 100px;"></div>
    </div>
